{% extends 'core/base.html' %}
{% block title %}Coca Cola | {{ SITE_NAME }}{% endblock %}
{% block content %}
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="row">
                <!-- Product image -->
                <div class="col-md-4 mb-3 text-center">
                    <img src="https://i.pinimg.com/736x/ad/48/06/ad480659e2a5884248126241bf11a4d6.jpg"
                         alt="Coca Cola"
                         class="img-fluid rounded border">
                </div>

                <!-- Product details -->
                <div class="col-md-8">
                    <p class="badge badge-info mb-2">Drink</p>
                    <h3 class="mb-2">Coca Cola</h3>
                    <h4 class="text-primary fw-bold mb-3">$ 1.25</h4>

                    <p class="mb-4">
                        <span class="badge badge-success">In Stock</span>
                    </p>

                    <form method="post" class="mb-3">
                        {% csrf_token %}
                        <div class="mb-3" style="max-width:150px">
                            <label for="id_quantity" class="form-label">Quantity</label>
                            <input type="number"
                                   name="quantity"
                                   id="id_quantity"
                                   class="form-control"
                                   value="1"
                                   min="1"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="mdi mdi-cart-outline"></i> Buy Now
                        </button>
                        <a href="{% url 'customer:list' %}" class="btn btn-outline-secondary">Back to Shop</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
