{% extends 'core/base.html' %}
{% block title %}Customer | {{ SITE_NAME }}{% endblock %}
{% block content %}
    <div class="col-12 grid-margin d-flex align-items-start gap-2 mb-3">
        <form class="forms-sample mb-0 d-flex gap-2" method="get">
            <div class="form-group mb-0">
                <input type="text" name="q" class="form-control" style="max-width:300px"
                       placeholder="Search Product Name...">
            </div>

            <div class="form-group mb-0 bg-white">
                <select name="category" class="form-control" style="max-width:200px">
                    <option value="">All Categories</option>
                    <option value="electronics">Drink</option>
                    <option value="groceries">Accessories</option>
                    <option value="clothing">Clothing</option>
                </select>
            </div>

            <button type="submit" class="btn btn-secondary">Filter</button>
        </form>
    </div>

    <!-- Product cards -->
    <div class="row">
        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card h-100 product-card">
                <img src="https://i.pinimg.com/736x/ad/48/06/ad480659e2a5884248126241bf11a4d6.jpg"
                     class="card-img-top" alt="Coca Cola" style="height:180px; object-fit:contain;">
                <div class="card-body d-flex flex-column">
                    <p class="badge badge-info align-self-start mb-2">Drink</p>
                    <h6 class="card-title mb-1">Coca Cola</h6>
                    <p class="text-primary fw-bold mb-2">$ 1.25</p>
                    <p class="badge badge-success align-self-start mb-3">In Stock</p>
                    <a href="{% url 'customer:detail' %}" class="btn btn-primary mt-auto w-100">Buy</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card h-100 product-card">
                <img src="https://i.pinimg.com/736x/ad/48/06/ad480659e2a5884248126241bf11a4d6.jpg"
                     class="card-img-top" alt="Sprite" style="height:180px; object-fit:contain;">
                <div class="card-body d-flex flex-column">
                    <p class="badge badge-info align-self-start mb-2">Drink</p>
                    <h6 class="card-title mb-1">Sprite</h6>
                    <p class="text-primary fw-bold mb-2">$ 1.10</p>
                    <p class="badge badge-warning align-self-start mb-3">Only 3 left</p>
                    <a href="{% url 'customer:detail' %}" class="btn btn-primary mt-auto w-100">Buy</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card h-100 product-card">
                <img src="https://i.pinimg.com/736x/ad/48/06/ad480659e2a5884248126241bf11a4d6.jpg"
                     class="card-img-top" alt="Lays Chips" style="height:180px; object-fit:contain;">
                <div class="card-body d-flex flex-column">
                    <p class="badge badge-warning align-self-start mb-2">Snack</p>
                    <h6 class="card-title mb-1">Lays Chips</h6>
                    <p class="text-primary fw-bold mb-2">$ 2.00</p>
                    <p class="badge badge-danger align-self-start mb-3">Out of Stock</p>
                    <button class="btn btn-secondary mt-auto w-100" disabled>Unavailable</button>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card h-100 product-card">
                <img src="https://i.pinimg.com/736x/ad/48/06/ad480659e2a5884248126241bf11a4d6.jpg"
                     class="card-img-top" alt="Water Bottle" style="height:180px; object-fit:contain;">
                <div class="card-body d-flex flex-column">
                    <p class="badge badge-info align-self-start mb-2">Drink</p>
                    <h6 class="card-title mb-1">Water Bottle</h6>
                    <p class="text-primary fw-bold mb-2">$ 0.75</p>
                    <p class="badge badge-success align-self-start mb-3">In Stock</p>
                    <a href="{% url 'customer:detail' %}" class="btn btn-primary mt-auto w-100">Buy</a>
                </div>
            </div>
        </div>
    </div>

    <style>
        .product-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
    </style>
{% endblock %}
