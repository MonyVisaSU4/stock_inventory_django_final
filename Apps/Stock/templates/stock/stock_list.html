{% extends 'core/base.html' %}
{% block title %}Stock | {{ SITE_NAME }}{% endblock %}
{% block content %}
    <div class="d-flex justify-content-end mb-3">
        <a href="{% url 'stock:add' %}" class="btn btn-primary">
            <i class="mdi mdi-plus"></i> Log Stock Movement
        </a>
    </div>

    <!-- Filters -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="get">
                <div class="row align-items-end">
                    <div class="col-md-3 mb-2">
                        <label class="form-label">Product</label>
                        <select name="product" class="form-control">
                            <option value="">All Products</option>
                            <option value="1">Coca Cola</option>
                            <option value="2">Sprite</option>
                        </select>
                    </div>

                    <div class="col-md-2 mb-2">
                        <label class="form-label">Type</label>
                        <select name="type" class="form-control">
                            <option value="">All Types</option>
                            <option value="IN">Stock In</option>
                            <option value="OUT">Stock Out</option>
                        </select>
                    </div>

                    <div class="col-md-2 mb-2">
                        <label class="form-label">From</label>
                        <input type="date" name="from" class="form-control">
                    </div>

                    <div class="col-md-2 mb-2">
                        <label class="form-label">To</label>
                        <input type="date" name="to" class="form-control">
                    </div>

                    <div class="col-md-3 mb-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="mdi mdi-filter-outline"></i> Filter
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Stock history table -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Product</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Note</th>
                    <th>Balance After</th>
                    <th>Performed By</th>
                </tr>
                </thead>
                <tbody>
                <tr class="pointer-event">
                    <td>Sept 25, 2026 14:30</td>
                    <td><p>Coca Cola</p></td>
                    <td><span class="badge badge-danger">Stock Out</span></td>
                    <td class="text-danger">-5</td>
                    <td>Sold to customer</td>
                    <td>15</td>
                    <td>John Deo</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
