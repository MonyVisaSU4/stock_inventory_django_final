{% extends 'core/base.html' %}
{% block title %}Inventory | {{ SITE_NAME }}{% endblock %}
{% block content %}
    <div class="col-5 grid-margin-md-2 d-flex align-items-start gap-2 mb-3">
        <form class="forms-sample mb-0 d-flex gap-2" method="get">
            <div class="form-group mb-0">
                <input type="text" name="q" class="form-control" style="max-width:300px"
                       placeholder="Search Product Name...">
            </div>

            <div class="form-group mb-0 bg-white">
                <select name="category" id="category-select" class="form-control" style="max-width:200px"
                        onchange="document.getElementById('category-other').style.display = this.value === 'other' ? 'block' : 'none'">
                    <option value="">All Categories</option>
                    <option value="electronics">Drink</option>
                    <option value="groceries">Accessories</option>
                    <option value="clothing">Clothing</option>
                    <option value="other">Other</option>
                </select>

                <input type="text" name="category_other" id="category-other" class="form-control mt-2 position-absolute z-3"
                       style="max-width:200px; display:none" placeholder="Enter category">
            </div>

            <button type="submit" class="btn btn-secondary">Filter</button>
        </form>

        <a href="/inventory/add" class="btn btn-primary">Add Product</a>
    </div>
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th> Product Name</th>
                            <th> Type</th>
                            <th> Unit Price</th>
                            <th> Quantity In Stock</th>
                            <th> Total Value</th>
                            <th> Reorder Level</th>
                            <th> Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr class="hover-cursor"
                            onclick='window.location.assign("{% url "inventory:detail" %}")'>
                            <td class="py-1">
                                <p>Coca Cola</p>
                            </td>
                            <td>
                                <p class="badge badge-info">Drink</p>
                            </td>
                            <td>
                                $ 1.25
                            </td>
                            <td>10</td>
                            <td>$ 12.5</td>
                            <td>
                                <p class="badge badge-danger">Very Low</p>
                            </td>
                            <td>
                                <a onclick="event.stopPropagation(); handleDelete()" class="btn btn-danger">Delete</a>
                                <a href="{% url "inventory:edit" %}" class="btn btn-info">Edit</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const handleDelete = () => {
            const swalWithBootstrapButtons = Swal.mixin({
                customClass: {
                    confirmButton: "btn btn-success",
                    cancelButton: "btn btn-danger"
                },
                buttonsStyling: false
            });
            swalWithBootstrapButtons.fire({
                title: "Are you sure?",
                text: "You won't be able to revert this!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes, delete it!",
                cancelButtonText: "No, cancel!",
                reverseButtons: false
            }).then((result) => {
                if (result.isConfirmed) swalWithBootstrapButtons.fire({
                    title: "Deleted!",
                    text: "Your file has been deleted.",
                    icon: "success"
                });
                else if (result.dismiss === Swal.DismissReason.cancel)
                    /* Read more about handling dismissals below */
                    swalWithBootstrapButtons.fire({
                        title: "Cancelled",
                        text: "Your imaginary file is safe :)",
                        icon: "error"
                    });
            });
        }
    </script>
{% endblock %}
