{% extends 'core/base-auth.html' %}
{% block title %}New Password | {{ SITE_NAME }}{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center mb-2">
                        Create New Password
                    </h3>

                    <p class="text-muted text-center mb-4">
                        Enter your new password below.
                    </p>

                    <form method="POST">
                        {% csrf_token %}

                        <!-- New Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                New Password
                            </label>

                            <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Enter new password"
                                    required
                            >
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">
                                Confirm Password
                            </label>

                            <input
                                    type="password"
                                    class="form-control"
                                    id="confirm_password"
                                    name="confirm_password"
                                    placeholder="Confirm new password"
                                    required
                            >
                        </div>

                        <button
                                type="submit"
                                class="btn btn-primary w-100"
                        >
                            Change Password
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>
{% endblock %}
