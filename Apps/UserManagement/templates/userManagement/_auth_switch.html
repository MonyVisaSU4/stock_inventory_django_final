{# Sign in / Register switch shown at the top of both auth pages. #}
{% with current=request.resolver_match.url_name %}
<ul class="nav nav-pills nav-fill mb-4" role="tablist">
    <li class="nav-item">
        <a class="nav-link {% if current == 'login' %}active{% endif %}"
           {% if current == 'login' %}aria-current="page"{% endif %}
           href="{% url 'usermanagement:login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Sign in</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if current == 'register' %}active{% endif %}"
           {% if current == 'register' %}aria-current="page"{% endif %}
           href="{% url 'usermanagement:register' %}">Register</a>
    </li>
</ul>
{% endwith %}
